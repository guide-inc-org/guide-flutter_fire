name: firebase_performance_platform_interface
description: A common platform interface for the firebase_performance plugin.
version: 0.1.4+34
homepage: https://firebase.flutter.dev/docs/performance/overview

environment:
  sdk: '>=2.18.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  _flutterfire_internals:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_fire.git
      ref: sbifx/v2.31.1
      path: packages/_flutterfire_internals
  firebase_core:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_fire.git
      ref: sbifx/v2.31.1
      path: packages/firebase_core/firebase_core
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.3

dev_dependencies:
  firebase_core_platform_interface:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_fire.git
      ref: sbifx/v2.31.1
      path: packages/firebase_core/firebase_core_platform_interface
  flutter_test:
    sdk: flutter
