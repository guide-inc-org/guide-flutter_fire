name: firebase_ml_model_downloader
description: A Flutter plugin allowing you to use Firebase Ml Model Downloader.
version: 0.4.0+6
homepage: https://firebase.google.com/docs/ml/flutter/use-custom-models
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_ml_model_downloader/firebase_ml_model_downloader
topics:
  - firebase
  - ml
  - model
  - downloader

false_secrets:
  - example/**

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  firebase_core:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_fire.git
      ref: kcfx/v4.4.0+1
      path: packages/firebase_core/firebase_core
  firebase_core_platform_interface:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_fire.git
      ref: kcfx/v4.4.0+1
      path: packages/firebase_core/firebase_core_platform_interface
  firebase_ml_model_downloader_platform_interface:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_fire.git
      ref: kcfx/v4.4.0+1
      path: packages/firebase_ml_model_downloader/firebase_ml_model_downloader_platform_interface
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  plugin_platform_interface: ^2.1.3

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.firebase_ml_model_downloader
        pluginClass: FirebaseModelDownloaderPlugin
      ios:
        pluginClass: FirebaseModelDownloaderPlugin
      macos:
        pluginClass: FirebaseModelDownloaderPlugin
